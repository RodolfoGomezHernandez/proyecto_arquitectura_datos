<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIK Data</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-IuGmZj9OxPX7B44W7F0WQuoZ6C1VmJ2rW3Nl0eQ3X6q5Gycqfa5D8lpkO3/n5AYT" crossorigin="anonymous">
    <style>
        body {
            background: #F5F7FA;
            color: #1F2A44;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .navbar-custom {
            background: #0B1F4D;
            border-bottom: 1px solid #E5E7EB;
        }
        .navbar-brand-text {
            font-size: 1.35rem;
            font-weight: 700;
            color: #FFFFFF;
            margin-bottom: 0;
        }
        .navbar-subtitle {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.85);
            margin-top: 0.2rem;
        }
        .navbar-brand-container {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 0.85rem;
        }
        .navbar-brand-container svg {
            display: block;
            flex: none;
        }
        .navbar-brand-text { margin-bottom: 0; }
        .nav-link {
            color: rgba(255, 255, 255, 0.95) !important;
            font-size: 0.95rem;
            padding: 0.45rem 0.75rem;
        }
        .nav-link:hover {
            color: #FFFFFF !important;
        }
        .content-container {
            max-width: 1180px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }
        .card-custom {
            background: #FFFFFF;
            border: 1px solid #E5E7EB;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
        }
        .card-custom-small {
            border-radius: 14px;
            border: 1px solid #E5E7EB;
        }
        .card-title {
            margin-bottom: 0.75rem;
            color: #1F2A44;
        }
        .metric-value {
            color: #2563EB;
            font-size: 1.6rem;
            font-weight: 700;
        }
        .metric-label {
            color: #1F2A44;
            margin-bottom: 0.35rem;
            font-size: 0.95rem;
        }
        .table thead th {
            border-bottom: 1px solid #E5E7EB;
            background: #FFFFFF;
            color: #1F2A44;
        }
        .table tbody tr td {
            border-top: 1px solid #E5E7EB;
            color: #1F2A44;
        }
        input[type=file] {
            width: 100%;
            border: 1px solid #E5E7EB;
            border-radius: 10px;
            padding: 0.75rem 0.85rem;
            color: #1F2A44;
            background: #FFFFFF;
        }
        .form-label {
            font-weight: 600;
            color: #1F2A44;
        }
        .btn-primary {
            background: #0B1F4D;
            border: 1px solid #0B1F4D;
        }
        .btn-primary:hover {
            background: #0F285E;
            border-color: #0F285E;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-custom py-3">
        <div class="container content-container d-flex flex-column flex-md-row align-items-start align-items-md-center justify-content-between gap-3">
            <div class="navbar-brand-container">
                <!-- Inline SVG icon (simple bar chart) -->
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
                    <rect x="3" y="14" width="3" height="7" rx="0.5" fill="#FFFFFF"/>
                    <rect x="9" y="9" width="3" height="12" rx="0.5" fill="#FFFFFF"/>
                    <rect x="15" y="5" width="3" height="16" rx="0.5" fill="#FFFFFF"/>
                </svg>
                <div>
                    <div class="navbar-brand-text">RIK Data</div>
                    <div class="navbar-subtitle">(Rodolfo, Isaías y Karen)</div>
                </div>
            </div>
            <div class="d-flex flex-wrap gap-2">
                <a class="nav-link" href="/">Inicio</a>
                <a class="nav-link" href="/panel/">Tablero</a>
            </div>
        </div>
    </nav>
    <main class="content-container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
